<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html {
        font-family: sans-serif;
      }

      .container {
        max-width: 600px;
        min-height: 100dvh;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      .menu-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .menu-generate-button {
        padding: 10px 15px;
        border-radius: 12px;
        border: none;
        background-color: brown;
        color: white;
      }

      .slot-machine-container {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .slot-machine-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 100px;
        width: 100%;
      }

      .slot-machine-item {
        width: 100%;
        height: 100px;
        border: 4px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <script src="main.js"></script>
  </body>
</html>
